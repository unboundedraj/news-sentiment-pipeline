[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newspipe"
version = "0.1.0"
description = "News-headline sentiment pipeline: historical + RSS + market ingestion, label lineage audit, daily feature store, walk-forward backtests tracked in MLflow, Airflow DAGs and a FastAPI scoring service."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14",
    "duckdb>=1.0",
    "scikit-learn>=1.3",
    "requests>=2.31",
    "pyyaml>=6.0",
    "vaderSentiment>=3.3",
    "pandera>=0.20",
]

[project.optional-dependencies]
tracking = ["mlflow>=2.14"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
newspipe = "newspipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
